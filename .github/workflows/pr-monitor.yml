name: PR Monitor

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  monitor-pr:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Check PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking PRs..."

          gh pr list \
            --repo "$REPO" \
            --state open \
            --json number,title,author,url
